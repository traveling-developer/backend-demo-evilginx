{{define "title"}}Dashboard{{end}}
{{define "content"}}
<h1>Welcome, {{.Username}}</h1>
<p class="success">You are signed in.</p>
<ul class="account">
  <li>Email: {{.Email}}</li>
  <li>TOTP MFA: {{if .HasTOTP}}enabled{{else}}not set up{{end}}</li>
  <li>Registered passkeys: {{.PasskeyCount}}</li>
</ul>
<div class="alt-methods">
  <a href="/register/passkey">Register a passkey</a>
</div>
<form method="post" action="/logout">
  <button type="submit" class="secondary">Sign out</button>
</form>
{{end}}
