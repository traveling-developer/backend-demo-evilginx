{{define "title"}}Verification{{end}}
{{define "content"}}
<h1>Two-factor verification</h1>
<p>Enter the 6-digit code from your authenticator app.</p>
{{if .Error}}<p class="error">Invalid code. Please try again.</p>{{end}}
<form method="post" action="/login/totp">
  <label>Code
    <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" autofocus required>
  </label>
  <button type="submit">Verify</button>
</form>
<div class="alt-methods"><a href="/login">Cancel</a></div>
{{end}}
