{{define "title"}}Willkommen{{end}}
{{define "content"}}
<h1>Willkommen bei {{.CorpName}}</h1>
<p>Melde dich an, um auf dein Konto zuzugreifen. Wähle eine Methode:</p>
<div class="methods">
  <a class="method" href="/login">
    <span class="method-title">Passwort</span>
    <span class="method-desc">Benutzername &amp; Passwort (optional mit 2FA)</span>
  </a>
  <a class="method" href="/login/magic">
    <span class="method-title">E-Mail-Link</span>
    <span class="method-desc">Einmaliger Anmeldelink per E-Mail</span>
  </a>
  <a class="method" href="/login/passkey">
    <span class="method-title">Passkey</span>
    <span class="method-desc">Anmeldung mit FIDO2 / WebAuthn</span>
  </a>
</div>
{{end}}
