{{define "title"}}Passkey{{end}}
{{define "content"}}
<h1>Sign in with a passkey</h1>
<p>Enter your username and confirm with your passkey.</p>
<p id="error" class="error" hidden></p>
<form id="passkey-form" onsubmit="return false;">
  <label>Username
    <input type="text" id="username" autocomplete="username webauthn" autofocus required>
  </label>
  <button type="button" id="passkey-login">Sign in with a passkey</button>
</form>
<div class="alt-methods"><a href="/login">Back</a></div>
<script src="/static/webauthn.js"></script>
<script>
  document.getElementById('passkey-login').addEventListener('click', loginPasskey);
</script>
{{end}}
