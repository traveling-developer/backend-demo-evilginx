{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}{{.CorpName}}{{end}} · {{.CorpName}}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Apply saved or system theme before first paint to avoid a flash.
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span>{{.CorpName}}</span>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark theme"></button>
    </div>
    {{template "content" .}}
  </main>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      // Show the icon for the theme you'd switch TO.
      function sync() {
        btn.textContent = document.documentElement.dataset.theme === "light" ? "🌙" : "☀️";
      }
      sync();
      btn.addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        sync();
      });
    })();
  </script>
</body>
</html>{{end}}
